<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abend-Ritual">
<meta name="theme-color" content="#EEEDFE">

<title>Abend-Ritual</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23D4537E'/%3E%3Cpolygon points='32,10 38,26 55,26 41,36 46,52 32,42 18,52 23,36 9,26 26,26' fill='%23FAC775'/%3E%3C/svg%3E">
<style>
:root{--bg:#EEEDFE;--pink:#D4537E;--pinkd:#72243E;--pinkbg:#FBEAF0;--pur:#7F77DD;--pur2:#534AB7;--purl:#CECBF6;--purd:#26215C;--gold:#FAC775;--goldd:#BA7517}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--purd);overscroll-behavior:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none;padding:0}
#app{max-width:540px;margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:max(env(safe-area-inset-top),12px) 16px max(env(safe-area-inset-bottom),16px);overflow-y:auto;overflow-x:hidden}
.screen.enter{animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.bg-lilac{background:var(--bg)}.bg-pink{background:var(--pinkbg)}.bg-mint{background:#EAF3DE}
.row{display:flex;align-items:center;gap:10px;width:100%}
.spread{justify-content:space-between}
.grow{flex:1}
.go{width:100%;max-width:380px;height:88px;border-radius:999px;background:var(--pink);color:#fff;font-size:40px;font-weight:800;letter-spacing:1px;box-shadow:0 7px 0 var(--pinkd);transition:transform .08s,box-shadow .08s}
.go:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pinkd)}
.go.alt{background:var(--pur);box-shadow:0 7px 0 var(--pur2)}
.rbtn{width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid #AFA9EC;display:grid;place-items:center;flex:none}
.rbtn:active{transform:scale(.94)}
.rbtn svg{width:34px;height:34px}
.small{font-size:14px;color:#5F5E5A}
.chain{display:flex;gap:7px;align-items:center;justify-content:center;margin:6px 0}
.dot{width:34px;height:34px;border-radius:50%;border:2px dashed #B4B2A9;background:#fff;display:grid;place-items:center;flex:none}
.dot.on{background:#F4C0D1;border:2px solid var(--pink)}
.dot svg{width:20px;height:20px}
.gift{width:36px;height:38px}
.stage{position:relative;width:min(78vw,38vh,340px);height:min(78vw,38vh,340px);border-radius:50%;background:#fff;border:5px solid var(--pur);display:grid;place-items:center;margin:8px 0}
.ani{overflow:visible;transform-origin:50% 92%}
.pick{display:flex;gap:8px;overflow-x:auto;width:100%;padding:6px 4px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick button{flex:none;width:56px;height:56px;border-radius:50%;background:#fff;border:2px solid #D3D1C7;display:grid;place-items:center}
.pick button.sel{border:4px solid var(--pink);background:var(--pinkbg)}
.pick svg{width:40px;height:43px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;font-weight:800;color:var(--purd)}
.say{font-size:22px;font-weight:700;text-align:center;color:var(--pinkd);margin:4px 8px;min-height:56px}
.card{background:#fff;border:2px solid #AFA9EC;border-radius:22px;padding:14px 16px;width:100%}
.card h3{margin:0 0 8px;font-size:18px}
.acard .name{font-size:19px;font-weight:700}
.acard .nbr{font-size:52px;font-weight:800;line-height:1}
.acard .tip{font-size:14px;color:#5F5E5A;margin-top:4px}
.fb{display:flex;gap:10px;margin-top:10px}
.fb button{flex:1;height:60px;border-radius:18px;font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.fb .ok{flex:1.6;background:var(--pur);color:#fff;font-size:20px}
.fb .up,.fb .dn{background:var(--purl);color:var(--purd)}
.fb button:active{transform:scale(.96)}
.fb button:disabled{opacity:.35}
.prog{display:flex;gap:8px;justify-content:center;margin:6px 0}
.prog i{width:12px;height:12px;border-radius:50%;background:#F4C0D1;display:block}
.prog i.on{background:var(--pink)}
.hold{position:relative;overflow:hidden}
.hold::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--pink)}
.hold.holding::after{width:100%;transition:width .9s linear}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.sgrid>div{aspect-ratio:1;border-radius:18px;background:#fff;border:2px solid var(--purl);display:grid;place-items:center;padding:4px}
.sgrid>div.lock{border:2px dashed #B4B2A9;background:rgba(255,255,255,.6);font-size:26px;color:#B4B2A9;font-weight:700}
.sgrid svg{width:100%;height:100%}
.hop{animation:hop .55s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.04,.94)}50%{transform:translateY(-26px) scale(.97,1.05)}}
.hop2{animation:hop2 .7s ease-in-out infinite}
@keyframes hop2{0%,100%{transform:translate(0,0)}25%{transform:translate(-14px,-18px)}50%{transform:translate(0,0)}75%{transform:translate(14px,-18px)}}
.crawl{animation:crawl .8s ease-in-out infinite alternate}
@keyframes crawl{from{transform:translateX(-18px) rotate(-5deg)}to{transform:translateX(18px) rotate(5deg)}}
.sway{animation:sway 2.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.stomp{animation:stomp .7s ease-in-out infinite}
@keyframes stomp{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(8px) rotate(3deg) scale(1.03,.95)}}
.flutter{animation:flutter .5s ease-in-out infinite alternate}
@keyframes flutter{from{transform:translateY(-6px) scale(.95,1.05) rotate(-4deg)}to{transform:translateY(-22px) scale(1.06,.96) rotate(4deg)}}
.side{animation:side 1.2s ease-in-out infinite alternate}
@keyframes side{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
.slow{animation:slow 3s ease-in-out infinite alternate}
@keyframes slow{from{transform:translateX(-14px) translateY(0)}to{transform:translateX(14px) translateY(-4px)}}
.roar{animation:roar 1.1s ease-in-out infinite}
@keyframes roar{0%,100%{transform:scale(1)}40%{transform:scale(1.14) rotate(-3deg)}60%{transform:scale(1.14) rotate(3deg)}}
.wiggle{animation:wiggle .7s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:skewX(-8deg) translateX(-10px)}to{transform:skewX(8deg) translateX(10px)}}
.breathe{animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.9)}50%{transform:scale(1.1)}}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.big-star{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.zzz{position:absolute;top:8%;right:14%;font-size:34px;font-weight:800;color:var(--pur);animation:zzz 2s ease-in-out infinite}
@keyframes zzz{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-12px);opacity:1}}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
label.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;font-size:16px;border-bottom:1px solid #EEEDFE}
input[type=text],input[type=password],input[type=number],textarea{width:100%;padding:10px 12px;border:2px solid var(--purl);border-radius:12px;font:inherit;font-size:16px;color:var(--purd);background:#fff}
input[type=number]{width:76px;text-align:center}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--pink)}
.pbtn{background:var(--pur);color:#fff;border-radius:14px;padding:12px 16px;font-weight:700;font-size:16px}
.pbtn.ghost{background:var(--purl);color:var(--purd)}
.pbtn.red{background:#F7C1C1;color:#791F1F}
.pt{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}
table.ex{width:100%;border-collapse:collapse;font-size:15px}
table.ex td{padding:7px 4px;border-bottom:1px solid #EEEDFE;vertical-align:middle}
table.ex td.r{text-align:right;font-weight:700}
.status{font-size:14px;color:#5F5E5A;margin:6px 0}
ol.help{margin:6px 0 0;padding-left:20px;font-size:14px;line-height:1.5;color:#444441}
@media (max-height:640px){.stage{width:200px;height:200px}.go{height:72px;font-size:32px}.ring{width:120px;height:120px}.ring .num{font-size:48px}}
@media (prefers-reduced-motion:reduce){.hop,.hop2,.crawl,.sway,.stomp,.flutter,.side,.slow,.roar,.wiggle,.breathe{animation-duration:2.4s}}
</style>
</head>

<script>

/* ========= Daten ========= */

var EX={
 squats:{name:'Squats',unit:'x',start:10,inc:1,min:4,say:'Squats',tip:'Füße hüftbreit, Po nach hinten, Rücken gerade.'},

 burpees:{name:'Burpees',unit:'x',start:3,inc:1,min:2,say:'Burpees',tip:'Langsam anfangen, Sprung weglassen ist okay.'},

function defState(){return{v:1,updated:0,start:null,animal:'bear',days:{},adj:{},startVals:{},gifts:{},opts:{sound:true,speech:true,knees:false,kidName:'',adultName:'Du',surprise:DEFAULT_SURPRISE}}}
var S=defState(),GH=null,syncing=false,syncMsg='',lastSyncOk=0;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function norm(x){var d=defState();if(!x||typeof x!=='object')return d;
 var o=Object.assign(d,x);o.opts=Object.assign(d.opts,x.opts||{});o.days=x.days||{};o.adj=x.adj||{};o.startVals=x.startVals||{};o.gifts=x.gifts||{};return o}
function load(){try{S=norm(JSON.parse(lsGet(KEY)||'null'))}catch(e){S=defState()}
 try{GH=JSON.parse(lsGet(GKEY)||'null')}catch(e){GH=null}}
function save(touch){if(touch!==false)S.updated=Date.now();lsSet(KEY,JSON.stringify(S))}
function mergeState(a,b){
 var newer=(a.updated>=b.updated)?a:b,older=newer===a?b:a;
 var r=norm(JSON.parse(JSON.stringify(newer)));
 r.updated=Math.max(a.updated,b.updated);
 var keys={};Object.keys(a.days).concat(Object.keys(b.days)).forEach(function(k){keys[k]=1});
 r.days={};
 Object.keys(keys).forEach(function(k){var x=a.days[k],y=b.days[k];
  if(!x||!y){r.days[k]=JSON.parse(JSON.stringify(x||y));return}
  var m=JSON.parse(JSON.stringify(x.t>=y.t?x:y));var o=x.t>=y.t?y:x;
  m.done=!!(x.done||y.done);m.ex=m.ex||{};
  Object.keys(o.ex||{}).forEach(function(e){if(!m.ex[e])m.ex[e]=o.ex[e]});
  r.days[k]=m});
 r.gifts=Object.assign({},older.gifts,newer.gifts);
 if(!r.start)r.start=older.start;else if(older.start&&older.start<r.start)r.start=older.start;
 return r}

/* ========= Datum & Zahlen ========= */
function pad(n){return String(n).padStart(2,'0')}
function dkey(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dnum(k){var p=k.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5)}
function addDays(k,n){var t=new Date((dnum(k)+n)*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())}
function doneDays(){return Object.keys(S.days).filter(function(k){return S.days[k].done}).sort()}
function doneCount(){return doneDays().length}
function todayDone(){var d=S.days[dkey()];return !!(d&&d.done)}
function streak(){var days=doneDays();if(!days.length)return 0;var t=dkey();var last=days[days.length-1];
 var gap=dnum(t)-dnum(last);if(gap>1)return 0;var n=1;
 for(var i=days.length-1;i>0;i--){if(dnum(days[i])-dnum(days[i-1])===1)n++;else break}return n}
function daysSinceLast(){var d=doneDays();if(!d.length)return 0;return dnum(dkey())-dnum(d[d.length-1])}
function weekIdx(){if(!S.start)return 0;return Math.max(0,Math.floor((dnum(dkey())-dnum(S.start))/7))}
function isDeload(){var w=weekIdx();return w>=3&&(w+1)%4===0}
function target(id){var e=EX[id],w=weekIdx(),steps=w-Math.floor(w/4);
 var base=(S.startVals[id]!=null&&S.startVals[id]!=='')?Number(S.startVals[id]):e.start;
 var v=base+(steps+(S.adj[id]||0))*e.inc;if(isDeload())v=v*0.8;return Math.max(e.min,Math.round(v))}
function exName(id){var n=EX[id].name;if(id==='pushups'&&S.opts.knees)n+=' (Knie)';return n}
function fmt(id,n){return EX[id].unit==='s'?n+' Sek.':n+' ×'}
function records(){var r={};Object.keys(S.days).forEach(function(k){var ex=S.days[k].ex||{};Object.keys(ex).forEach(function(id){
 if(ex[id].fb!=='down'&&(!r[id]||ex[id].n>r[id]))r[id]=ex[id].n})});return r}
function history(id){return doneDays().map(function(k){var e=(S.days[k].ex||{})[id];return e?e.n:null}).filter(function(x){return x!=null}).slice(-12)}
function plan(){var n=doneCount();var out=[{type:'warm'}];
 ['legs','push','core','cardio'].forEach(function(c,r){var a=ROT[c];var id=a[n%a.length];out.push({type:'round',ex:id,move:MOVES[(n*4+r)%MOVES.length]})});
 out.push({type:'cool'});return out}
function stageOf(n){return n<3?0:n<7?1:n<14?2:3}

/* ========= Ton ========= */
var ac=null;
var spUnl=false;
function unlock(){if(!spUnl&&S.opts.speech&&'speechSynthesis' in window){spUnl=true;try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}}
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}}
function tone(f,d,type,v,t0){if(!S.opts.sound||!ac)return;var t=ac.currentTime+(t0||0);var o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v||0.2,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+0.03)}
function clap(t0){if(!S.opts.sound||!ac)return;var t=ac.currentTime+(t0||0);var len=Math.floor(ac.sampleRate*0.09);var b=ac.createBuffer(1,len,ac.sampleRate);var d=b.getChannelData(0);
 for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);var s=ac.createBufferSource();s.buffer=b;var f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=0.8;var g=ac.createGain();g.gain.value=0.9;s.connect(f);f.connect(g);g.connect(ac.destination);s.start(t)}
var sfx={
 tick:function(){tone(660,0.12,'triangle',0.2)},

 clapN:function(n){for(var i=0;i<n;i++)clap(i*0.16)},

};
function say(txt){if(!S.opts.speech||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';
 var vs=speechSynthesis.getVoices()||[];var v=vs.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf('de')===0})[0];if(v)u.voice=v;u.rate=0.92;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}
function kn(){return S.opts.kidName?(' '+S.opts.kidName):''}

/* ========= Konfetti ========= */
var cvs=document.getElementById('confetti'),cx=cvs.getContext('2d'),parts=[],raf=0;
function sizeCv(){cvs.width=innerWidth*devicePixelRatio;cvs.height=innerHeight*devicePixelRatio}
addEventListener('resize',sizeCv);sizeCv();
function confetti(n){n=n||140;var cols=['#D4537E','#7F77DD','#FAC775','#ED93B1','#AFA9EC','#97C459','#85B7EB'];var W=cvs.width,H=cvs.height;
 for(var i=0;i<n;i++)parts.push({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*devicePixelRatio,vy:(-Math.random()*16-4)*devicePixelRatio,w:(6+Math.random()*8)*devicePixelRatio,h:(4+Math.random()*6)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],life:0});
 if(!raf)raf=requestAnimationFrame(tickC)}
function tickC(){cx.clearRect(0,0,cvs.width,cvs.height);parts=parts.filter(function(p){return p.y<cvs.height+40&&p.life<260});
 parts.forEach(function(p){p.life++;p.vy+=0.45*devicePixelRatio;p.vx*=0.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});
 if(parts.length)raf=requestAnimationFrame(tickC);else{raf=0;cx.clearRect(0,0,cvs.width,cvs.height)}}

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ani(id,size,cls,stage,sleepy){
 var acc='';
 if(stage>=1)acc+='<g transform="translate(78 14) rotate(18)"><path d="M0 0 l-14 -9 v18z M0 0 l14 -9 v18z" fill="#D4537E" stroke="#72243E" stroke-width="1.5" stroke-linejoin="round"/><circle r="4" fill="#ED93B1" stroke="#72243E" stroke-width="1.5"/></g>';
 if(stage>=2)acc+='<polygon points="42,22 45,4 54,14 60,0 66,14 75,4 78,22" fill="#FAC775" stroke="#BA7517" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="16" r="2.4" fill="#D4537E"/>';
 if(stage>=3)acc+='<use href="#st" x="8" y="20" fill="#FAC775"/><use href="#st" x="112" y="30" fill="#ED93B1"/><use href="#st" x="14" y="100" fill="#AFA9EC"/><use href="#st" x="108" y="104" fill="#FAC775"/>';
 var sc=[0.78,0.9,1,1.08][stage||0];

function startSession(){

 var animalId,anim,sayTxt,ringHtmlStr='',bottom='';
 if(st.type==='warm'){animalId=S.animal;anim=ph==='go'?'hop':'';sayTxt=ph==='ready'?'Erst ein Hampelmann zum Aufwärmen!':'Hampelmann! Hüpf mit mir!'}
 else if(st.type==='cool'){animalId='flam';anim=ph==='go'?'sway':'';sayTxt=ph==='ready'?'Jetzt wird es ruhig. Wie ein Flamingo!':'Tief ein … und langsam aus …'}

 else ringHtmlStr='';
 var adult='';
 if(st.type==='round'){var e=EX[st.ex],t=target(st.ex),nm=esc(S.opts.adultName||'Du');
  var showNum=EX[st.ex].unit==='s'?(ph==='go'?sess.left+' Sek.':t+' Sek.'):t+' ×';

 document.getElementById('giftdone').style.display='block';box.removeAttribute('data-act');
 say('Du hast einen goldenen Stern bekommen! '+(S.opts.surprise||''))}

/* ========= Sync (GitHub) ========= */
function statusText(){if(!GH||!GH.repo)return 'Nicht verbunden. Der Spielstand liegt nur auf diesem Gerät.';return syncMsg||'Verbunden mit '+GH.repo}
function setStatus(m){syncMsg=m;var e=document.getElementById('gst');if(e)e.textContent=statusText()}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,''))))}
function ghUrl(){return 'https://api.github.com/repos/'+GH.repo+'/contents/'+(GH.path||'ritual-data.json')}
function ghHead(){return{'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}
async function sync(manual,retry){
 if(!GH||!GH.repo||!GH.token||syncing)return;syncing=true;if(manual)setStatus('Gleiche ab …');
 try{
  var r=await fetch(ghUrl()+'?t='+Date.now(),{headers:ghHead(),cache:'no-store'});var sha=null,remote=null;
  if(r.status===200){var j=await r.json();sha=j.sha;try{remote=norm(JSON.parse(b64dec(j.content)))}catch(e){remote=null}}
  else if(r.status===404){var jj=null;try{jj=await r.json()}catch(e){}
   if(jj&&/not found/i.test(jj.message||'')&&!(await repoExists())){throw new Error('Repo nicht gefunden oder Token ohne Zugriff')}}
  else if(r.status===401||r.status===403)throw new Error('Token ungültig oder ohne Rechte')
  else throw new Error('GitHub antwortet mit '+r.status);
  if(remote){var m=mergeState(S,remote);S=m;save(false)}
  var body=JSON.stringify(S);
  if(!remote||JSON.stringify(remote)!==body){
   var pr=await fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHead()),body:JSON.stringify({message:'Spielstand '+new Date().toISOString(),content:b64enc(body),sha:sha||undefined})});
   if(pr.status===409||pr.status===422){syncing=false;if(!retry)return await sync(manual,true);throw new Error('Konflikt, später nochmal')}
   if(!pr.ok){if(pr.status===404||pr.status===403)throw new Error('Kein Schreibzugriff: Token braucht „Contents: Read and write“');throw new Error('Speichern fehlgeschlagen ('+pr.status+')')}}
  lastSyncOk=Date.now();setStatus('Abgeglichen um '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}));
  if(view==='home'||view==='wall')render();
 }catch(e){setStatus('Nicht abgeglichen: '+(e&&e.message?e.message:'keine Verbindung'))}
 finally{syncing=false}}
async function repoExists(){try{var r=await fetch('https://api.github.com/repos/'+GH.repo,{headers:ghHead()});return r.status===200}catch(e){return false}}

/* ========= Eingaben ========= */
var ACT={
 home:function(){go('home')},wall:function(){go('wall')},
 toggleSound:function(){S.opts.sound=!S.opts.sound;save();render()},
 pick:function(el){S.animal=el.dataset.id;save();sfx.pop();render()},
 pet:function(){unlock();var st=document.querySelector('.stage .ani');if(st){st.classList.remove('hop');void st.getBoundingClientRect();st.classList.add('hop');setTimeout(function(){st.classList.remove('hop')},1200)}
  sfx.pop();var sl=doneCount()>0&&daysSinceLast()>=3;say(sl?'Hurra, du bist wieder da!':['Hallo'+kn()+'!','Bist du bereit?','Ich habe dich lieb!'][Math.floor(Math.random()*3)])},
 start:function(){unlock();startSession();setTimeout(function(){sayRound(curStep())},300)},
 phaseGo:phaseGo,
 fb:function(el){onFb(el.dataset.v)},
 openGift:function(){go('gift')},unwrap:unwrap,
 ghsave:function(){var repo=document.getElementById('ghrepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,''),tok=document.getElementById('ghtoken').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){setStatus('Repo bitte als name/repo eintragen');return}
  if(!tok){setStatus('Bitte Token eintragen');return}
  GH={repo:repo,token:tok,path:'ritual-data.json'};lsSet(GKEY,JSON.stringify(GH));sync(true)},
 ghnow:function(){if(!GH){setStatus('Erst Repo und Token eintragen');return}sync(true)},
 ghoff:function(){GH=null;try{localStorage.removeItem(GKEY)}catch(e){}setStatus('');render()}
};
var HOLD={
 parent:function(){go('parent')},
 quit:function(){try{speechSynthesis.cancel()}catch(e){}go('home')},
 reset:function(){S=defState();save();go('home')}
};
app.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el||el.disabled)return;unlock();var f=ACT[el.dataset.act];if(f)f(el,e)});
app.addEventListener('change',function(e){var t=e.target;
 if(t.dataset.opt){S.opts[t.dataset.opt]=t.type==='checkbox'?t.checked:t.value;save()}
 if(t.dataset.sv){var v=parseInt(t.value,10);if(isFinite(v)&&v>0){S.startVals[t.dataset.sv]=v;save()}}});
var holdT=null,holdEl=null;
app.addEventListener('pointerdown',function(e){var el=e.target.closest('[data-hold]');if(!el)return;unlock();holdEl=el;el.classList.add('holding');var act=el.dataset.hold;holdT=setTimeout(function(){holdT=null;if(holdEl)holdEl.classList.remove('holding');HOLD[act]&&HOLD[act]()},900)});
function endHold(){if(holdT){clearTimeout(holdT);holdT=null}if(holdEl){holdEl.classList.remove('holding');holdEl=null}}
['pointerup','pointercancel','pointerleave'].forEach(function(ev){app.addEventListener(ev,endHold,true)});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view!=='session'){sync(false)}});
addEventListener('online',function(){sync(false)});

/* ========= Start ========= */
load();
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=function(){}}catch(e){}}
render();
sync(false);
</script>
